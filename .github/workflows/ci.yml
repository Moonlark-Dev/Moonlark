name: CI

on:
  pull_request:
    types: [opened, synchronize]
  # 合并进 main 的组合（两个 PR 各自绿、合起来坏）在 PR 阶段没人验证，这里补一次
  push:
    branches: [main]


jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.11
  
      - name: Setup Poetry
        uses: snok/install-poetry@v1.4.2

      - name: Check poetry.lock is in sync
        run: |
          # 两层校验，且都不修改提交上来的 lock（不一致就让作者本地重锁，CI 不再代劳）：
          # 1. 根 pyproject.toml 的 content-hash —— 必须先查，因为下面的 poetry lock 会重写它
          # 2. src/pyproject.toml 的约束不在 content-hash 覆盖范围内，改用「重新解析后的已锁定版本集合」
          # 这里只用 poetry lock：它保留已锁定的版本；poetry update 会把所有依赖浮动到约束内最新，
          # 让每个 PR 都重写 poetry.lock，是并发 PR 互相冲突的根源。
          poetry check --lock
          cp poetry.lock "$RUNNER_TEMP/poetry.lock.committed"
          poetry lock
          python .github/scripts/check_poetry_lock.py "$RUNNER_TEMP/poetry.lock.committed" poetry.lock

      - name: Install dependencies
        run: |
          poetry install --all-groups
      
      - name: Check database update
        run: |
          cp .env.template .env
          poetry run nb orm upgrade
          poetry run nb orm check | grep '没有检测到新的升级操作' && exit 0
          exit 1

      - name: Run pytest
        env:
          SQLALCHEMY_DATABASE_URL: sqlite+aiosqlite://
          ALEMBIC_STARTUP_CHECK: "False"
        run: poetry run pytest tests/ -v
      
      - name: Generate COMMANDS.md
        run: |
          poetry run nb larkhelp-generate zh_hans COMMANDS.md
      
      - name: Commit and push changes
        # push 事件（main）上没有可回推的 PR 分支，只做校验
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # checkout 使用 persist-credentials: false，需显式配置 token 才能 push
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          # 只回推 COMMANDS.md：poetry.lock 由贡献者或 Dependabot 维护，CI 不再改写它
          git add COMMANDS.md
          if ! git diff --cached --quiet; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Auto update from GitHub Actions"
            git push origin "HEAD:$HEAD_REF"
          else
            echo "No changes to commit."
          fi

      
 
