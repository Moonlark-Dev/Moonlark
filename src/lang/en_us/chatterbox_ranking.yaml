  description: 群话痨排行
  details: 统计群聊中的话痨，该功能不支持 QQ 节点且需要在群聊中手动启用。
  usage1: ct [total|7d|1d] (群话痨排行，默认总榜)
  usage2: ct [total|7d|1d] --global (全局话痨排行)
  usage3: ct -e|-d (功能开关)
  usage4: ct [total|7d|1d] me|<@用户> (查询指定用户的话痨排行)
