help:
  description: 有无有无
  details: |
    根据提示词猜答案的小游戏。

    题目里 ⭕ 行是包含答案特征的词，❌ 行是不包含答案特征的词，同一列的两个词为一组。
    最多可以作答 10 次；猜中奖励 3 VimCoin，三分钟没有任何消息时自动公布答案。
  usage1: has-or-not (开始一局游戏)
  usage2: has-or-not <答案> (作答)
  usage3: has-or-not 查看答案 (查看答案并结束本局)
  usage4: has-or-not 规则说明 (查看玩法规则)

button:
  guess: 作答
  reveal: 查看答案
  rules: 规则说明
  again: 再玩一次

game:
  preparing: 正在生成题目，请稍候……
  preparing_short: 题目还在生成中，请稍候再作答。
  generate_failed: 出题失败了，请稍后再试。
  error: 游戏出错了，本局已结束。
  rules: |
    「有无有无」玩法
    - 题目给出 ⭕、❌ 两行词语，同一列的两个词为一组：⭕ 里的词包含答案的特征，❌ 里的词不包含。
    - 根据这六组词语的对比猜出答案；每局最多作答 {} 次，猜中可以获得 VimCoin 奖励。
    - 发送 {__prefix__}has-or-not <答案> 作答（QQ 官方机器人下本局所有成员都可以作答，其它平台只有发起者可以作答）。
    - 发送 {__prefix__}has-or-not 查看答案 公布答案并结束本局；发送 {__prefix__}has-or-not 规则说明 可以随时再看这份说明。
  not_playing_start: 当前会话没有正在进行的「有无有无」，请先发送 {__prefix__}has-or-not 开始一局。
  already_playing: 当前会话已经有一局「有无有无」了，发送 {__prefix__}has-or-not <答案> 作答，或发送 {__prefix__}has-or-not 查看答案 结束本局。
  only_owner: 当前适配器下只有发起这局游戏的人可以作答。
  correct: 🎉 猜对了！答案是「{}」，获得 {} VimCoin。
  correct_no_reward: 🎉 猜对了！答案是「{}」。（VimCoin 奖励发放失败）
  wrong: ❌「{}」不对，还剩 {} 次作答机会。
  reveal_timeout: ⌛ 三分钟没有任何消息，游戏结束。答案是「{}」。
  reveal_manual: 已查看答案，游戏结束。答案是「{}」。
  reveal_attempts: 十次作答机会用完了，游戏结束。答案是「{}」。
  reveal_before_question: 题目还没生成出来，本局已结束。
  again_hint: 发送 {__prefix__}has-or-not 可以再来一局。
  hint: 发送 {__prefix__}has-or-not <答案> 作答（只有发起者可以作答）；发送 {__prefix__}has-or-not 规则说明 查看规则；发送 {__prefix__}has-or-not 查看答案 可直接公布答案。

judge:
  rules: |
    「有无有无」是一个根据提示词猜共同特征的小游戏：
    1. 题目给出三组同类型的对照词（`question.pairs`），其中 `question.contains`（⭕ 行）的三个词在常见场景下都具备答案所描述的特征，`question.missing`（❌ 行）的三个词在常见场景下都不具备该特征。
    2. 答案应是一个具体、客观的特征（可以是文字或特殊符号），且答案不能直接出现在题目的六个词语上。
    3. 因为游戏名为「有无有无」（即“⭕ 有 / 具备某特征，❌ 无 / 不具备某特征”），同一个特征在日常作答中既可以用名词表示“有什么 / 是什么”，也可以用动词、形容词、短语或符号表示“会怎样 / 是怎样的”，这些表述在游戏语境下本质相同。
  instructions: |
    请结合 `rules`（玩法规则）、`question`（题目中的三组 ⭕/❌ 对照词）与 `reference_answer`（出题参考答案），判断玩家的作答 `guess` 是否符合本题规则、算作正确答案。
    不要孤立、机械地比较 `guess` 与 `reference_answer` 在字面或词性上是否指代同一个事物，而要结合题目背景判断：两者在「有无有无」语境下是否表达了本质相同的特征，或者 `guess` 本身是否同样严格符合本题“⭕ 都有、❌ 都没有”的规则。
  'true': |
    满足以下任一情形即判为正确：
    1. 在「有无有无」（⭕ 有该特征、❌ 无该特征）的题目语境下，`guess` 与 `reference_answer` 表达的本质特征一致——不论词性或句式差异（名词、动词、形容词、短语均可）、是否省略“有/会/能/是/带”等修饰词，或使用同义词、常见简称、口语说法、符号名称、符号写法及大小写/全半角变体。例如：题目 ⭕ 为“台灯 萤火虫 路灯”、❌ 为“书架 蚯蚓 电线杆”、参考答案为“会发光”时，“光”“发光”“光源”“能发光”“有光”本质上都在描述同一特征，均算正确；参考答案为“圆形”时，“圆”“o”“O”“⭕”均算正确；参考答案为“+”时，“加号”“十字”均算正确。
    2. `guess` 虽然与 `reference_answer` 表述角度不同，但本身是一个具体、客观的特征，严格满足本题全部三组对照词（三个 `contains` 词在常见场景下都具备该特征、三个 `missing` 词在常见场景下都不具备），且没有直接出现在题目的六个词语上。
  'false': |
    以下任一情形判为错误：
    1. `guess` 不符合题目的三组对照规则：存在某个 `contains`（⭕）词实际上不具备该特征，或某个 `missing`（❌）词在常见场景下也具备该特征（例如题目 ⭕ 为“台灯 萤火虫 路灯”时猜“用电”“灯泡”，萤火虫并不符合；题目 ⭕ 为“轮胎 盘子 钟表”、参考答案为“圆形”时猜“球”，三者并不是球；参考答案为“+”、题目含“日历 键盘”时猜“红十字”，日历和键盘上的并不是红十字）。
    2. `guess` 与 `reference_answer` 只是宽泛相关，在题目语境下既不表达同一本质特征，也不能准确区分本题的 ⭕ 与 ❌。
    3. `guess` 直接出现在题目的六个词语上（例如题目含“台灯、路灯”时直接猜“灯”或“台灯”），或是空泛、主观、投机的无效描述（例如“好看”“常见物品”）。
