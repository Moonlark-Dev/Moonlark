help:
  description: 有无有无
  details: |
    根据提示词猜答案的小游戏。

    题目里 ⭕ 行是包含答案特征的词，❌ 行是不包含答案特征的词，同一列的两个词为一组。
    最多可以作答 10 次；猜中奖励 3 VimCoin，三分钟没有任何消息时自动公布答案。
  usage1: has-or-not (开始一局游戏)
  usage2: has-or-not <答案> (作答)
  usage3: has-or-not 查看答案 (查看答案并结束本局)

button:
  guess: 作答
  reveal: 查看答案

game:
  preparing: 正在生成题目，请稍候……
  preparing_short: 题目还在生成中，请稍候再作答。
  generate_failed: 出题失败了，请稍后再试。
  error: 游戏出错了，本局已结束。
  not_playing_start: 当前会话没有正在进行的「有无有无」，请先发送 {__prefix__}has-or-not 开始一局。
  already_playing: 当前会话已经有一局「有无有无」了，发送 {__prefix__}has-or-not <答案> 作答，或发送 {__prefix__}has-or-not 查看答案 结束本局。
  only_owner: 当前适配器下只有发起这局游戏的人可以作答。
  correct: 🎉 猜对了！答案是「{}」，获得 {} VimCoin。
  correct_no_reward: 🎉 猜对了！答案是「{}」。（VimCoin 奖励发放失败）
  wrong: ❌「{}」不对，还剩 {} 次作答机会。
  reveal_timeout: ⌛ 三分钟没有任何消息，游戏结束。答案是「{}」。
  reveal_manual: 已查看答案，游戏结束。答案是「{}」。
  reveal_attempts: 十次作答机会用完了，游戏结束。答案是「{}」。
  hint: 发送 {__prefix__}has-or-not <答案> 作答（只有发起者可以作答）；发送 {__prefix__}has-or-not 查看答案 可直接公布答案。

judge:
  instructions: 判断玩家的猜测与正确答案是否指代同一个事物或概念。
  'true': 猜测与正确答案含义相同：同义词、常见简称、口语说法、符号写法，或只有大小写、全半角差异，都算相同。例如答案是“圆形”时，“圆”“o”“O”“⭕”都算相同。
  'false': 猜测与正确答案只是相关或属于上下位概念，或外形相近但指代不同事物。例如答案是“圆形”时，“球”不算相同。
