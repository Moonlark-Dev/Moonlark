  reload: 权限表缓存已刷新，共 {} 条记录。
access:
  failed: 您没有权限使用这个指令！
help:
  description: 权限管理
  details: Moonlark 权限控制 (仅 SUPERUSER 可用)
  usage1: access {{ban|pardon}} <主体ID> (封禁/解封用户)
  usage2: access {{block|unblock}} <权限> <主体ID> (添加/移除权限)
  usage3: access reload (重新加载权限表缓存)