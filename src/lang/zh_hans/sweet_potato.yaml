info:
  rules: |
    # 烫手山芋

    群内 2～8 人参与，机器人随机选一名玩家持有山芋。轮到持有者时二选一：

    - **传递**：按当前爆炸概率判定，没被烫到就把山芋传给指定玩家，下家重新抽取爆炸概率。
    - **捂热**：重新抽取当前山芋的爆炸概率，抽到 100% 立即爆炸。

    每次重新抽取只能从当前概率下限到 100% 之间抽取；抽取后概率下限更新为抽到的值（传递后的特例除外）。
    传递后重新抽取时，如果抽到高于 90% 的概率，有 10% 概率在「下限 − 5% ~ 下限」之间抽取下一次传递的概率，此时不更新下限。

    持有者连续 60 秒没有操作也会爆炸。山芋爆炸时本局结束，被烫到的玩家 -10 HP。

    **概率档位**（不显示具体数值）：
    - 0～50%：安全
    - 51～70%：低危
    - 71～89%：中危
    - 90～94%：高危
    - 95～98%：极危
    - 99～100%：即将爆炸

    **计奖**（按操作前的档位计算，游戏结束后统一发放）：

    | 档位 | 传递 | 捂热 |
    | --- | --- | --- |
    | 低危 | 1vi | 3vi |
    | 中危 | 2vi | 5vi |
    | 高危 | 3vi | 8vi |
    | 极危 | 6vi | 15vi |
    | 即将爆炸 | 12vi | 30vi |

    安全档不计奖。操作导致自己爆炸时，本次不计奖，此前累计的 vi 保留，但仍扣 10 HP。

    「成功捂热」指捂热时没有爆炸，并且之后成功把山芋传给了下一位玩家；这个次数会累加到排行榜。

    **指令**
    - {__prefix__}sweet-potato create（创建房间）
    - {__prefix__}sweet-potato join（加入当前会话的房间）
    - {__prefix__}sweet-potato start（开始游戏，仅房主可用）
    - {__prefix__}sweet-potato pass <序号|@玩家|random>（传递山芋）
    - {__prefix__}sweet-potato hold（捂热山芋）
    - {__prefix__}sweet-potato quit（退出房间 / 解散房间，游戏中不可用）
    - {__prefix__}sweet-potato restart（游戏结束后再开一把）
    - {__prefix__}sweet-potato rank（成功捂热次数排行）

    创建或加入房间时会自动完成注册，无需手动注册。

