help:
  description: WORDLE
  details: |
    猜单词的游戏，支持多人游玩。

    按「位置正确 / 字母存在 / 字母不存在」的提示逐行排除，6 次之内猜中即获胜；发送 q 可以放弃本局。

    游玩提示：为了避免干扰使用，不成功的匹配不会被提示，也不能在一个会话中同时开启多个 WORDLE 游戏。
  usage1: wordle [长度=5]
