help:
  description: 合成机
  details: 把原料放进合成机并支付 VimCoin，等待一段时间后取走产物（会自动放入背包）。合成机可使用 VimCoin 升级，等级越高能同时进行的合成越多。
  usage1: craft (查看合成机、配方与进行中的合成)
  usage2: craft start <配方ID> [数量] (开始合成)
  usage3: craft collect (收取已完成的合成产物)
  usage4: craft upgrade (升级合成机，等级 1-4 对应 2/4/6/10 个槽位)
