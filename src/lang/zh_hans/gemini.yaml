help_gem_model:
  description: Gemini 模型管理
  details: 管理 Gemini 模型配置（仅限超级用户）
  usage1: gem-model (查看模型配置信息)
  usage2: "gem-model <模型名> (更换默认模型)"
  usage3: "gem-model <模型名> <应用标识> (设置应用专用模型)"
  usage4: "gem-model :default: <应用标识> (删除应用配置)"

gem_model:
  no_permission: "权限不足：只有 superuser 可以使用此命令"
  set_default: "✅ 已将默认模型设置为: {0}"
  set_identify: "✅ 已将应用 {0} 的模型设置为: {1}"
  remove_identify: "✅ 已删除应用 {0} 的模型配置，将使用默认模型"
  no_identify_config: "⚠️ 应用 {0} 没有特定的模型配置"
  no_override: "(无特殊配置)"
  models_list_failed: "⚠️ 获取模型列表失败: {0}"
  info: |
    📋 Gemini 模型配置信息

    🔹 默认模型: {default_model}

    🔹 应用特殊配置:
    {override_list}

    🔹 可用模型列表:
    {models_list}

    📝 使用方法:
      /gem-model - 显示此信息
      /gem-model <模型名> - 更换默认模型
      /gem-model <模型名> <应用标识> - 设置应用模型
      /gem-model :default: <应用标识> - 删除应用配置
