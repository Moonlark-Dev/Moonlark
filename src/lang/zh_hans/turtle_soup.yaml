help:
  description: 海龟汤
  details: |
    AI 主持的「海龟汤」（情境猜谜）游戏。
    系统会给出一个离奇的情境描述（汤面），你只能提出可以用「是 / 不是 / 不重要」回答的问题，
    通过一步步提问推理出完整的故事真相（汤底）。群里所有人都可以提问，一局最多 50 个问题，
    本局在 36 小时内都有效；期间 Moonlark 的闲聊会被暂时收起，专心当主持人。
  usage1: turtle-soup (开始一局海龟汤)
  usage2: turtle-soup 〈问题〉 (向主持人提问)
  usage3: turtle-soup progress (查看当前进度)
  usage4: turtle-soup hint (获取一条提示)
  usage5: turtle-soup recalculate (重新计算当前进度)
  usage6: turtle-soup give-up (放弃本局并公布汤底)
  usage7: turtle-soup rank (查看正确作答数排行)
  usage8: turtle-soup help (查看玩法说明)

