message:
  start_hint: |
    直接发送 {__prefix__}turtle-soup 〈你的问题〉 就可以提问，问题要能用「是 / 不是 / 不重要」回答。
    也可以点击下方按钮提问、查看进度、要提示或放弃。
  ask_hint: 继续发送 {__prefix__}turtle-soup 〈你的问题〉 提问，或使用下方按钮。
  end_hint: 发送 {__prefix__}turtle-soup 可以再来一局。
  hint_line: 第 {0}/{1} 条提示
  recalculated: 进度已重新核算为 {0}%。
  rank_item: '{0}. {1} —— 答对 {2} 题'
  rank_me: 你当前的排名是第 {0} 名，共答对 {1} 题。
  rules: |
    规则说明
    1. 主持人只会回答「是」「不是」「不重要」，不会给出额外解释。
    2. 提问要尽量是封闭式问题，例如「这个人是故意的吗？」「事情发生在室内吗？」。
    3. 当你的提问复述出汤底的主要真相时，主持人会直接公布汤底，本局结束。
    4. 群里所有人都可以提问；同一会话同时只能有一局。
    5. 一局最多 {0} 个问题，本局在 36 小时内有效。
    常用指令：
    - 开始：{__prefix__}turtle-soup
    - 提问：{__prefix__}turtle-soup 〈你的问题〉
    - 查看进度：{__prefix__}turtle-soup progress
    - 获取提示：{__prefix__}turtle-soup hint
    - 放弃并公布汤底：{__prefix__}turtle-soup give-up
    - 正确作答数排行：{__prefix__}turtle-soup rank

