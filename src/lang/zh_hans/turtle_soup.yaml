  no: 不是
  irrelevant: 不重要
  solved: 恭喜你，推理非常精彩！

judge:
  decision:
    answer_instructions: |
      根据谜题与玩家的最新提问，判断应该回答「是」「不是」还是「不重要」。
      玩家陈述的内容与谜题事实一致时选 yes；与谜题事实冲突时选 no；
      与谜题无关、对解谜没有帮助或无法用是/否回答时选 irrelevant。
      只做三选一，不要考虑进度。
    answer_yes: 玩家最新提问或陈述与谜题事实一致，应回答「是」。
    answer_no: 玩家最新提问或陈述与谜题事实冲突，应回答「不是」。
    answer_irrelevant: 提问与谜题无关、无法用是/否回答，或对解谜没有帮助，应回答「不重要」。
    solved_instructions: |
      判断玩家最新的提问或陈述是否已经完整复述出汤底的核心真相（不只是接近，而是基本说中）。
      如果玩家只是在猜测或只说到部分线索，请选 false。
    solved_true: 玩家已经基本说出汤底的核心真相，本局可以结束。
    solved_false: 玩家还没有说出汤底的核心真相，本局继续。
    progress_instructions: |
      评估玩家目前距离揭开汤底有多近，按 0 到 10 的整数等级打分：
      0 表示完全没有进展，10 表示已经完整说出汤底。
      以汤底的关键要素被揭示的比例为准，不要因为提问数量多就给高分。
      只要汤底还没有被完整复述，最高只给 9。
    progress_level_0: 完全没有进展，问题和谜题几乎没有关系。
    progress_level_1: 只确认了场景里最基础、最明显的事实。
    progress_level_2: 摸到了一点方向，但仍停留在谜题表面。
    progress_level_3: 排除了若干明显错误的方向。
    progress_level_4: 已经确认了一部分关键背景事实。
    progress_level_5: 掌握了汤底的一半线索，方向基本正确。
    progress_level_6: 关键要素中的一部分已经被明确揭示。
    progress_level_7: 大部分关键要素已经被揭示，只差最后的串联。
    progress_level_8: 已非常接近真相，只差一个核心细节。
    progress_level_9: 几乎说出汤底，但仍有重要细节没有确认。
    progress_level_10: 已经完整说出汤底的核心真相。

