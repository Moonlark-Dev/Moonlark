  usage2: "splat switch <数字> (切换默认鸡蛋种类)"
  usage3: "splat <@用户> [数量] [-t/--type <数字|英文id>] (向指定用户丢鸡蛋，鸡蛋减 0.2 HP，臭鸡蛋减 1 HP 且附着霉运，臭鸡蛋 Ex 减 2 HP、恶臭 6 小时，砸中 Moonlark 会被反弹)"
  usage4: "splat rank/throwers [7d|30d|total] (被砸 / 丢鸡蛋排行榜)"
  usage5: "splat info [@用户] (查询砸鸡蛋信息)"
