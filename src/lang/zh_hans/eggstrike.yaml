  description: 砸鸡蛋
  details: 向指定用户丢鸡蛋造成伤害，查看被砸 / 丢鸡蛋排行榜和个人砸鸡蛋信息。臭鸡蛋会附着霉运，臭鸡蛋 Ex 命中后爆炸，Moonlark 会反弹所有鸡蛋。
