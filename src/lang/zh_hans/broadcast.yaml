help:
  description: 广播管理
  details: 发送和管理广播消息，可附加仅在 QQ 官方机器人上显示的自定义按钮
  usage1: bcsu (查看广播管理菜单)
  usage2: bcsu <内容> (设置广播内容)
  usage3: bcsu clear (清除广播内容)
  usage4: bcsu preview (预览广播内容)
  usage5: bcsu submit (提交并发送广播)
  usage6: bcsu button add <按钮名> <指令> (添加广播按钮，仅 QQ 官方机器人生效)
  usage7: bcsu button remove <按钮名> (移除广播按钮)
  usage8: bcsu button clear (清空全部广播按钮)
  usage9: bcsu button list (查看当前广播按钮)

bc_help:
  description: 广播设置
  details: 开启或关闭所在群聊的广播接收
  usage1: bc (查看广播状态)
  usage2: bc on (开启广播)
  usage3: bc off (关闭广播)

bc:
  group_only: "此命令只能在群聊中使用"
  enabled: "广播功能已启用"
  state: |
    功能开关：{}
    最后一次广播内容：
  disabled: "广播功能已禁用"
  invalid_action: "无效的操作，请使用 on/off"
