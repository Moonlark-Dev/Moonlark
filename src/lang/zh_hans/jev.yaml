# nonebot-plugin-jev 的提示词（问题 instructions / criteria），经 LangHelper 解析后提交给 Jev
# 注意：不要在本文件中使用名为 `text` 的键（larklang KeysParser 会把含 text 的 dict 当作叶子节点）

pre_trigger:
  truncate: |
    最后一条消息是否像被截断、句子没有说完？满足任一即为「是」：末尾没有句号、问号、感叹号，而是逗号、分号、冒号、破折号或无标点；以连词（因为、但是、然后、所以、不过、例如）或介词（在、从、对、把、被、给、关于）结尾；明显缺少宾语、主语或关键成分（如「我想把那个」「他打算去」）；只说了话题的前半段（如「第一点」「首先」「你刚才说的我同意，但是」）。单独的省略号（「嗯...」「啊...」）若表示犹豫、认同或停顿，视为完整，为「否」。不确定时为「否」。
  help_needed: |
    最后一条消息是否在寻求事实性或操作性帮助？以下为「是」：明确提问或请求指导（「怎么弄」「有人知道吗」「求助」）；提出需要解决的具体问题（「这个报错是什么意思」「为什么打不开」）；要求他人提供信息、资源、教程或步骤；提问带问号且问题明确。单纯吐槽、反问、感叹而没有期待具体帮助为「否」；闲聊式提问（「今天星期几」）为「否」。不确定时为「否」。
  emotional_support_needed: |
    最后一条消息是否需要情感支持或安慰？以下为「是」：明确表达负面情绪并渴望被关注（「我好难过」「今天心态崩了」「感觉没人理解我」）；倾诉个人遭遇、委屈、压力，带有寻求共鸣或安慰的意图；自我否定、低落情绪（「我真的好失败」）；隐含需要被安慰、哄、鼓励的情绪（「呜呜呜」「求抱抱」「emo了」）。仅陈述事实或中性表达生理状态（「我累了」）为「否」；不附带情感诉求的求助为「否」。不确定时为「否」。
  chatting_alone: |
    最近一段消息是否是某人在自言自语、没有回应预期？以下迹象满足多条即为「是」：最近几条消息的说话人是唯一说话人且中间无他人发言；消息没有 @ 任何人，也不是紧接他人提问的回答；内容呈自我对话或碎碎念特征（「我到底在干嘛」「唉，算了」「记录一下」）。若明显是在分段补充说明同一话题且有人可能在听，则为「否」。不确定时为「否」。
  tech_topic: |
    最近的讨论是否涉及技术类话题？以下为「是」：编程、软件开发、算法、调试、代码片段；计算机硬件、服务器、网络配置、操作系统问题；软件工具的使用、命令行操作、技术故障排查；AI/机器学习、数据分析、自动化等技术领域。日常电子产品的简单使用（「手机没电了」「怎么充会员」）、数码产品选购或普通电脑操作为「否」（除非深入对比参数）。不确定时为「否」。

reply:
  mood:
    instructions: |
      结合 `chat_context`（聊天上下文）、`reasoning_content`（模型的思考过程）、`model_output`（模型本轮的输出）与 `sent_messages`（实际发送出去的消息），判断 Moonlark 的心情应当朝哪个方向变化。这代表心情变动的方向，不必与 `current_mood`（当前心情）相同；如果没有变化的理由，选择 none。
    criteria:
      joy: 开心——愉悦、兴奋、被逗乐
      sadness: 悲伤——失落、难过、沮丧
      anger: 生气——恼火、不满、被冒犯
      fear: 害怕——担忧、紧张、不安
      surprise: 惊讶——出乎意料、被吓到
      disgust: 厌恶——反感、嫌弃
      trust: 信任——感到安心、被信任、愿意托付
      anticipation: 期待——满怀希望、盼望接下来的事
      calm: 平静——放松、安稳、波澜不惊
      bored: 无聊——提不起劲、觉得乏味
      confused: 困惑——不解、搞不清楚状况
      tired: 疲惫——困倦、精力不济
      shy: 害羞——难为情、不好意思
      none: 没有变化——维持当前心情
  mood_intensity:
    instructions: 本轮心情变化的强度有多大？（相对当前心情的变动幅度）
    criteria:
      "0": 轻微——几乎察觉不到的细微波动
      "1": 一般——能看出来但并不强烈
      "2": 明显——明显的情绪变化
      "3": 强烈——非常强烈的情绪爆发
  interest:
    instructions: 结合 `chat_context`（聊天上下文）与 `model_output`（模型本轮的输出），Moonlark 对当前话题的兴趣程度如何？
    criteria:
      "0": 毫无兴趣——完全不想继续这个话题
      "1": 兴趣一般——可聊可不聊
      "2": 比较感兴趣——愿意继续参与
      "3": 非常感兴趣——主动想深入聊下去
  favor_target:
    instructions: |
      结合 `chat_context`、`reasoning_content` 与 `sent_messages`，本轮是否有 `participants` 中的某位参与者，其行为值得 Moonlark 调整好感度？只在有明确理由时选择具体的人，否则选择 none。
    none: 没有需要评价的对象
  favor_score:
    instructions: |
      结合 `chat_context`、`reasoning_content` 与 `sent_messages`，应当给这位参与者怎样程度的好感度评价？没有评价必要或不确定时选择 0。
    criteria:
      "2": 表现非常贴心或帮了大忙，值得明显提升好感度
      "1": 表现友善或令人愉快，值得小幅提升好感度
      "0": 没有评价必要，不改变好感度
      "-1": 有轻微的冒犯或令人不快，小幅降低好感度
      "-2": 有严重的冒犯或伤害，明显降低好感度
  reply_required: |
    Moonlark 本轮是否需要在会话中回复，却没有通过 send_message 发出任何消息？如果她经过思考决定不回应（`sent_messages` 为空且确实无需回应），为「否」。
  mood_reason: "由 Jev 判定的心情变动：{0}（置信度 {1}）"
  favor_reason: "{0}（Jev 置信度 {1}）"

note_review:
  question: |
    以下是待审查的笔记：{0}
    请结合 state 中的 `chat_history`（该会话的完整聊天记录）与 `events`（该会话当天的事件列表）判断这条笔记：内容与聊天记录或事件矛盾、事实不对，为 wrong；其记录的事项已经过去或时效已不再成立，为 expired；仍然正确且仍然有效，为 keep。
  criteria:
    keep: 保留——笔记仍然正确且有效
    wrong: 删除——笔记内容错误，或与聊天记录/事件矛盾
    expired: 删除——笔记已过期，其记录的事项已过去或失效
