help:
  description: 跳蚤市场
  details: |
    玩家间物品交易市场：可以将背包中的物品上架出售，也可以购买其他玩家出售的物品。
    所有交易收取 1% 手续费。
    上架价格（第三个参数）留空时按该物品的平均成交价出售；填写连续的 + 或 - 可相对均价上浮或下调 1%（每多一个符号多 1%，最多 5%），例如 +++ 表示高于均价 3%；
    也可以直接填写数字作为固定单价，用于还没有成交记录的物品。
  usage1: market (查看市场概况)
  usage2: market list [页码] (浏览在售商品，每页 10 件)
  usage3: market sell <背包编号> [数量] [价格] (上架物品，数量留空表示全部)
  usage4: market buy <名称|编号> [数量] (购买物品)
  usage5: market sell 3 5 +++ (将背包编号 3 的物品以高于均价 3% 的价格上架 5 个)
main:
  info: 当前市场上有 {} 件商品正在出售
sell:
  index_error: 背包中不存在此物品
  item_locked: 该物品已被锁定，无法上架
  wrong_count: 出售数量不能为负数！
  item_not_enough: 出售失败，选中的物品只有 {} 个，数量不足
  wrong_price: 价格参数无效：请填写正数或连续的 + / -，留空则按均价上架
  no_base_price: 该物品还没有成交记录，请直接填写固定单价上架
  done: 完成！已将 {} 个「{}」以单价 {} VimCoin 的价格上架至跳蚤市场
