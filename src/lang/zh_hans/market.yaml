  wrong_count: 购买数量必须大于 0
  not_found: 没有找到正在出售的「{}」
  no_enough_vimcoin: VimCoin 不足，无法购买
  finish: 完成！购买了 {} 个「{}」，总共花费了 {} VimCoin
