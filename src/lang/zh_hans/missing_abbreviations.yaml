  generate_failed: 出题失败了，请稍后再试。
  error: 游戏出错了，本局已结束。
  rules: |
    「缩略」规则说明
    把原词中构成缩略词的字或字母抽走，只保留剩下部分作为题面；还原原词后，提交被抽走的「缩略词」即可。

    示例：
    - 题面「林匹克动」→ 原词「[奥]林匹克[运]动[会]」→ 答案「奥运会」
    - 题面「而没有什么用」→ 原词「[然]而[并]没有什么[卵]用」→ 答案「然并卵」

    规则：
    - 提示：卡关时可查看提示（提示 1 用 ○ 标出缩略词位置，如「○林匹克○动○」；部分题目另有提示 2 说明领域或语境），不扣次数也不减少奖励。
    - 次数与奖励：每局最多作答 {0} 次，猜中奖励 {1} VimCoin；误填原词全称会提醒且不扣次数；连续三分钟无消息将自动公布答案。
    - 判题：忽略大小写、全半角与空格，常见带点英文缩写（如 e.g. / eg）均兼容。

    常用指令（完整指令 missing-abbreviations，别名「缩略」「ma」）：
    - {__prefix__}缩略（开始游戏）
    - {__prefix__}缩略 <答案>（作答；QQ 官方机器人下本局所有成员均可参与，其他平台仅发起者可作答）
    - {__prefix__}缩略 提示（查看提示）
    - {__prefix__}缩略 查看答案（提前结束本局）

    灵感来源：https://pqr.pkupuzzle.art/missing-abbreviations/
  rules_markdown: |
    ### 缩略 · 规则说明

    把原词中构成缩略词的字或字母抽走，只展示剩下部分作为题面。还原原词后，提交**被抽走的缩略词**即可作答（不是原词全称）。

    **举个例子**
    - **林匹克动** ← **奥**林匹克**运**动**会** → 答案 **奥运会**
    - **而没有什么用** ← **然**而**并**没有什么**卵**用 → 答案 **然并卵**

    **提示与判题**
    - **提示**：卡关时可查看提示（提示 1 用 `○` 标出缩略词位置，如 `○林匹克○动○`；部分题目另有提示 2 说明领域或语境），不扣作答次数也不减少奖励。
    - **作答**：每局最多 **{0}** 次，猜中奖励 **{1} VimCoin**；误填原词全称会收到提醒且不扣次数。
    - **匹配**：忽略大小写、全半角与空格，常见带点英文缩写（如 `e.g.` / `eg`）均兼容；连续三分钟无消息将自动公布答案。

    **常用操作**
    - 点击下方按钮，或发送 `{__prefix__}缩略 答案` 作答（本局所有成员均可参与）
    - 发送 `{__prefix__}缩略 提示` 查看提示，`{__prefix__}缩略 查看答案` 提前结束（完整指令 `missing-abbreviations`，别名 `ma`）

    灵感来源：https://pqr.pkupuzzle.art/missing-abbreviations/
