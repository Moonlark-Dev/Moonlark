help:
  description: 缩略
  details: |
    通过缩略词中被缩略的部分猜出缩略词的文字推理小游戏。

    每局选定一个常见原词（全称）及其公认缩略词（简称），将原词中构成缩略词的字或字母抽走，只把被省略的剩余部分按原顺序拼接展示为题面。例如题面给出「林匹克动」，对应原词「奥林匹克运动会」，玩家需要提交被抽走的那部分缩略词「奥运会」作答（注意提交的是缩略词本身而非原词全称；误填原词全称会收到提醒且不扣作答次数）。
    遇到困难可发送「提示」免费解锁提示（第 1 条为 ○ 骨架掩码提示，标明缩略词在原词中的位置与长度；部分题目配有第 2 条领域或语境提示），使用提示不扣作答次数也不减少奖励。
    每局最多可作答 10 次，猜中奖励 3 VimCoin；连续三分钟无任何消息时自动公布答案并结束本局。支持指令别名「缩略」「ma」。
    灵感来源：https://pqr.pkupuzzle.art/missing-abbreviations/
  usage1: missing-abbreviations (开始一局游戏)
  usage2: missing-abbreviations <答案> (提交缩略词作答)
  usage3: missing-abbreviations 提示 (免费解锁下一条提示)
  usage4: missing-abbreviations 查看答案 (查看答案并结束本局)
  usage5: missing-abbreviations 规则说明 (查看玩法规则)

