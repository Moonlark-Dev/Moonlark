game:
  preparing: 正在生成题目，请稍候……
  preparing_short: 题目还在生成中，请稍候再试。
  generate_failed: 出题失败了，请稍后再试。
  error: 游戏出错了，本局已结束。
  rules: |
    「缩略」规则说明
    1. 题目结构：每局选定一个常见原词（全称）及其缩略词（简称），将原词中构成缩略词的字或字母抽走，只把被省略的剩余部分按原顺序拼接展示为题面。
    2. 作答要求：根据题面还原原词，并提交「被抽走的那部分缩略词」（注意不要填原词全称；误填原词全称会收到提醒且不扣次数）。
       示例：题面「林匹克动」→ 原词「[奥]林匹克[运]动[会]」→ 答案是「奥运会」。
    3. 免费提示：发送 {__prefix__}missing-abbreviations 提示 可免费解锁提示（提示 1 用 ○ 标出缩略词在原词中的位置与长度，部分题目另有提示 2 点明领域或语境），不扣作答次数也不减少奖励。
    4. 次数与奖励：每局最多作答 {0} 次（忽略大小写与空格，英文缩写请留意缩写点等标点），猜中可获得 {1} VimCoin；连续三分钟没有任何消息会自动公布答案。
    5. 常用指令（支持别名「缩略」「ma」）：
       - 开始游戏：{__prefix__}missing-abbreviations
       - 提交答案：{__prefix__}missing-abbreviations <答案>（QQ 官方机器人下本局所有成员均可作答，其他平台仅发起者可作答）
       - 免费提示：{__prefix__}missing-abbreviations 提示
       - 公布答案：{__prefix__}missing-abbreviations 查看答案（提前结束本局）
    灵感来源：https://pqr.pkupuzzle.art/missing-abbreviations/
  rules_markdown: |
    ### 「缩略」规则说明
    1. **题目结构**：选定一个常见**原词（全称）**及其**缩略词（简称）**，将原词中构成缩略词的字或字母抽走，只把被省略的剩余部分按原顺序拼接展示为题面。
    2. **作答要求**：还原原词后，提交**被抽走的那部分缩略词**（注意**不要填原词全称**；误填原词全称会收到提醒且不扣次数）。

    | 题面 | 原词拆解 | 正确答案（缩略词） | 提示 1（骨架掩码） |
    | ----------- | ----------- | ----------- | ----------- |
    | 林匹克动 | 【奥】林匹克【运】动【会】 | 奥运会 | ○林匹克○动○ |
    | 而没有什么用 | 【然】而【并】没有什么【卵】用 | 然并卵 | ○而○没有什么○用 |

    3. **免费提示**：点击「提示」按钮或发送 `{__prefix__}missing-abbreviations 提示` 可免费解锁提示（提示 1 用 `○` 标出缩略词在原词中的位置与长度，部分题目另有提示 2 点明领域或语境），**不扣作答次数，也不减少猜中奖励**。
    4. **次数与奖励**：每局最多作答 **{0}** 次（忽略大小写与空格，英文缩写请留意缩写点等标点），猜中奖励 **{1} VimCoin**；连续三分钟无任何消息将自动公布答案。
    5. **操作方式**：点击下方按钮，或发送 `{__prefix__}missing-abbreviations 答案`（别名 `缩略`、`ma`）作答（本局所有成员均可参与）、发送 `{__prefix__}missing-abbreviations 查看答案` 提前结束本局。

    灵感来源：https://pqr.pkupuzzle.art/missing-abbreviations/
