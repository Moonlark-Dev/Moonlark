  generate_failed: 出题失败了，请稍后再试。
  error: 游戏出错了，本局已结束。
  rules: |
    「缩略」规则说明
    1. 玩法：把原词（全称）中构成缩略词的字或字母抽走，只保留剩下的部分作为题面；请还原原词并提交被抽走的「缩略词」。
       示例：题面「林匹克动」→ 原词「[奥]林匹克[运]动[会]」→ 答案「奥运会」（注意填缩略词，不是原词全称；误填全称会收到提醒且不扣次数）。
    2. 免费提示：发送「提示」可依次解锁提示（提示 1 用 ○ 标出缩略词的位置与字数，部分题目另有提示 2 点明领域/语境），不扣次数也不减少奖励。
    3. 判题与奖励：每局最多作答 {0} 次（忽略大小写、全半角与空格，常见带点英文缩写如 e.g. / eg 均兼容），猜中奖励 {1} VimCoin；连续三分钟无任何消息将自动公布答案。
    4. 常用指令（完整指令 missing-abbreviations，别名「缩略」「ma」）：
       - 开始游戏：{__prefix__}缩略
       - 提交答案：{__prefix__}缩略 <答案>（QQ 官方机器人下本局所有成员均可作答，其他平台仅发起者可作答）
       - 查看提示：{__prefix__}缩略 提示
       - 公布答案：{__prefix__}缩略 查看答案（提前结束本局）

    灵感来源：https://pqr.pkupuzzle.art/missing-abbreviations/
  rules_markdown: |
    ### 「缩略」规则说明
    1. **玩法**：将原词（全称）中构成缩略词的字或字母抽走，只展示剩下的部分作为题面。请还原原词，提交被抽走的**缩略词**（不是原词全称；误填全称会提醒且不扣次数）。

    | 题面 | 原词拆解 | 答案 |
    | :--- | :--- | :--- |
    | 林匹克动 | \[奥\]林匹克\[运\]动\[会\] | 奥运会 |
    | 而没有什么用 | \[然\]而\[并\]没有什么\[卵\]用 | 然并卵 |

    提示 1 会用 `○` 标出缩略词的位置与字数（如 `○林匹克○动○`），部分题目另有提示 2 点明领域或语境。

    2. **免费提示**：点击「提示」按钮或发送 `{__prefix__}缩略 提示` 即可免费解锁提示，**不扣作答次数，也不减少猜中奖励**。
    3. **判题与奖励**：每局最多作答 **{0}** 次（忽略大小写、全半角与空格，带点英文缩写如 `e.g.` / `eg` 均兼容），猜中奖励 **{1} VimCoin**；连续三分钟无任何消息将自动公布答案。
    4. **操作方式**：点击下方按钮，或发送 `{__prefix__}缩略 答案`（完整指令 `missing-abbreviations`，别名 `ma`）作答（本局所有成员均可参与）、发送 `{__prefix__}缩略 查看答案` 提前结束本局。

    灵感来源：https://pqr.pkupuzzle.art/missing-abbreviations/
