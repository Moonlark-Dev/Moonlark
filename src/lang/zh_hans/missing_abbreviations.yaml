help:
  description: 缩略
  details: |
    根据缩略词中被省略的部分，逆向猜出缩略词的文字推理小游戏。

    每局将原词（全称）中构成缩略词的字或字母抽走，只展示剩下的部分作为题面。例如题面「林匹克动」来自原词「[奥]林匹克[运]动[会]」，正确答案是缩略词「奥运会」（不是原词全称；误填全称会提醒且不扣次数）。
    卡关时可发送「提示」免费解锁提示（第 1 条用 ○ 标出缩略词的位置与字数，部分题目另附第 2 条领域/语境提示），使用提示不扣次数也不减少奖励。
    每局最多作答 10 次，猜中奖励 3 VimCoin；连续三分钟无消息将自动公布答案。支持别名「缩略」「ma」。

    灵感来源：https://pqr.pkupuzzle.art/missing-abbreviations/
  usage1: missing-abbreviations (开始一局游戏)
  usage2: missing-abbreviations <答案> (提交缩略词作答)
  usage3: missing-abbreviations 提示 (免费查看下一条提示)
  usage4: missing-abbreviations 查看答案 (公布答案并结束本局)
  usage5: missing-abbreviations 规则说明 (查看玩法规则)

