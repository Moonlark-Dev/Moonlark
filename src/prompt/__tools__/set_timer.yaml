description: |
  在当前会话中设置一个一次性的定时器：经过指定分钟数后，系统会向本会话注入一条事件
  「计时器 <description> 已触发」，并强制你立刻生成一次回复（也就是真的发出一条消息）。

  **触发时会发生什么**
  - 定时器到点后自动失效，不会被重复触发；如果你需要重复提醒，请在触发后重新设置一个。
  - 触发时你能看到的信息只有本会话的上下文和这条触发事件，所以 description 必须自己讲清楚
    「到点后要做什么、对谁说」，要写成留给未来自己的完整指令，而不是只写一个关键词。
  - 触发事件会强制你回复，因此定时器一定会带来一条发出去的消息；请只在确实需要未来发言时使用。
  - 定时器绑定当前会话（群聊或私聊），重启后仍会恢复；在群聊里设置的定时器会在对应的群里发言。

  **何时使用**
  - 有人要求你过一段时间再提醒、跟进或检查某件事，例如「十分钟后提醒我喝水」。
  - 你希望稍后主动关心某件事的进展，而现在无法一直等待或盯着。

  **何时不要使用**
  - 现在就能完成的事情，不要用定时器代替等待。
  - 不要为了「过一会儿再看看有没有新消息」而设置定时器，会话有新消息时你自然会收到。
  - 不要同时设置多个内容高度重复的定时器。
parameters:
  - name: delay
    description: "延迟时间，单位为分钟（整数）。例如 10 表示 10 分钟后触发；小于 1 分钟或非整数分钟暂不支持。"
    type: integer
    required: true
  - name: description
    description: "留给未来自己的完整指令：到点后要做什么、对谁说。例如「提醒小明去交作业，并问他写完了没有」。请勿只写「提醒」这类无法独立理解的词。"
    type: string
    required: true
