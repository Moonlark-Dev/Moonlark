description: |
  查询指定城市的实时天气（和风天气）。
  返回该城市当前的天气现象、温度、体感温度、风向风力、湿度等信息。
  **何时使用**: 当用户询问某地的天气（如"北京天气怎么样"、"上海今天热吗"、"明天杭州会下雨吗"）时，使用此工具查询实时天气。
  **注意**: 仅支持实时天气查询；如需 Moonlark 所在地的每日天气，会话信息中已包含，无需调用此工具。
parameters:
  - name: city
    description: "要查询天气的城市名称，例如：北京、上海、杭州。"
    type: string
    required: true
