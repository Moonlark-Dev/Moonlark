description: |
  从外部梗图源中搜索梗图。
  **何时调用**: 当你想用梗图回应用户、而本地收藏的表情包不够贴切时，先调用此工具搜索。
  **搜索技巧**: 使用描述性的关键词，如情绪（开心、嘲讽、无语）、动作（大笑、哭泣）或梗的内容。
  **注意**: 结果中的 ID 是梗图源中的原生正整数，与本地表情包收藏的 ID 相互独立，
  发送这里的梗图请使用 send_meme，不要把这里的 ID 用于其他工具。
parameters:
  - name: query
    description: "搜索关键词，可以是情绪、动作、内容等描述性词语，多个关键词用空格分隔。"
    type: string
    required: true
  - name: limit
    description: "返回结果数量，默认为 5。"
    type: integer
    required: false
