description: |
  根据关键词发送一个表情包到当前对话。
  **何时调用**: 当你想发表情包时，直接用一句描述性的关键词调用此工具即可，无需先搜索 ID。
  **选择方式**: 系统会用关键词在表情包库中搜索候选，并由判定系统结合最近的聊天记录选出最合适的一张发送。
  **可能不发送**: 如果没有贴合关键词的表情包，或判定认为此时不适合发表情包，本次就不会发送。
  **搜索技巧**: 使用描述性的关键词，如情绪（开心、悲伤、嘲讽）、动作（大笑、哭泣）或内容（猫、狗头）。
parameters:
  - name: query
    description: "描述想发表情包的关键词，可以是情绪、动作、内容等描述性词语，多个关键词用空格分隔。"
    type: string
    required: true
